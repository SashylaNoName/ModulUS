<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои предметы — ModulUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('modulus-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div id="app-header"></div>

<div class="container-fluid">
  <div class="row g-0">
    <div class="col-lg-2 col-md-3" id="app-sidebar"></div>
    <div class="col-lg-10 col-md-9 p-3 p-md-4">

      <div data-reveal>
        <h3 class="fw-bold mb-1">Мои предметы</h3>
        <p style="color:var(--text-muted);" class="mb-4">Нажмите, чтобы увидеть оценки и комментарии</p>
      </div>

      <div class="row g-3" id="subj-cards"></div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
CURRENT_USER.role = 'student'; saveRole('student');
CURRENT_USER.name = 'Алексеев Артём Дмитриевич';
CURRENT_USER.avatar = 'АА';
mountHeader();
document.getElementById('app-sidebar').innerHTML = renderStudentSidebar('subjects');

const grades = { 'Программирование':'отл','Высшая математика':'хор','Базы данных':'отл','Английский язык':'зачёт','Физика':'удовл' };
document.getElementById('subj-cards').innerHTML = SUBJECTS.map((s, i) => `
  <div class="col-md-6 col-lg-4" data-reveal data-delay="${(i%3)+1}">
    <a href="student-subject.html?subject=${s.id}" class="card feature-card h-100 text-decoration-none" style="color:var(--text);">
      <div class="d-flex justify-content-between align-items-start">
        <div class="feature-icon soft mb-2" style="width:44px;height:44px;font-size:1.1rem;">📚</div>
        <span class="badge ${grades[s.name]==='отл'?'badge-role-student':grades[s.name]==='удовл'?'badge-role-teacher':'badge-group'}">${grades[s.name]||'—'}</span>
      </div>
      <h6 class="fw-bold mb-1">${s.name}</h6>
      <div class="small" style="color:var(--text-muted);">Иванова М. П.</div>
    </a>
  </div>`).join('');
initPage();
</script>
</body>
</html>
