<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Предметы — ModulUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('modulus-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div id="app-header"></div>

<div class="container-fluid">
  <div class="row g-0">
    <div class="col-lg-2 col-md-3" id="app-sidebar"></div>
    <div class="col-lg-10 col-md-9 p-3 p-md-4">

      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4" data-reveal>
        <div><h3 class="fw-bold mb-1">Предметы</h3>
        <p class="mb-0" style="color:var(--text-muted);">Группы, сгруппированные по предметам</p></div>
        <button class="btn btn-outline-primary" onclick="demoAction('добавить предмет')"><i class="bi bi-plus-lg"></i> Добавить предмет</button>
      </div>

      <div class="accordion" id="subj-accordion" data-reveal></div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
CURRENT_USER.role = 'teacher'; saveRole('teacher');
mountHeader();
document.getElementById('app-sidebar').innerHTML = renderTeacherSidebar('subjects');

document.getElementById('subj-accordion').innerHTML = SUBJECTS.map((s, i) => {
  const groups = GROUPS.filter(g => g.subjectId === s.id);
  return `<div class="accordion-item mb-2" style="border-radius:1rem;overflow:hidden;">
    <h2 class="accordion-header">
      <button class="accordion-button ${i?'collapsed':''}" type="button" data-bs-toggle="collapse" data-bs-target="#subj-${s.id}">
        <span class="feature-icon soft me-2 mb-0" style="width:34px;height:34px;font-size:.9rem;">📚</span>
        <strong>${s.name}</strong>
        <span class="badge badge-group ms-2">${groups.length} групп</span>
      </button>
    </h2>
    <div id="subj-${s.id}" class="accordion-collapse collapse ${i?'':'show'}">
      <div class="accordion-body p-0">
        ${groups.length ? `<table class="table table-pretty align-middle mb-0">
          <thead><tr><th>Группа</th><th>Уровень</th><th>Студентов</th><th class="text-end">Действие</th></tr></thead>
          <tbody>${groups.map(g => `<tr class="cursor-pointer" onclick="location.href='gradebook.html?group=${g.id}'">
            <td>${g.name}</td>
            <td><span class="badge ${g.level==='Магистратура'?'badge-role-teacher':'badge-role-student'}">${g.level}</span></td>
            <td>${g.students}</td>
            <td class="text-end" onclick="event.stopPropagation()">
              <a href="group-form.html?id=${g.id}" class="btn btn-sm btn-light" title="Редактировать"><i class="bi bi-pencil"></i></a>
            </td>
          </tr>`).join('')}</tbody>
        </table>` : '<div class="empty-state"><p class="mb-0" style="color:var(--text-muted);">Нет групп по этому предмету</p></div>'}
      </div>
    </div>
  </div>`;
}).join('');
initPage();
</script>
</body>
</html>
