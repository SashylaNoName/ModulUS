<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Предметы — ModulUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-header"></div>

<div class="container-fluid">
  <div class="row">
    <div class="col-lg-2 col-md-3 p-0" id="app-sidebar"></div>
    <div class="col-lg-10 col-md-9 p-4">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold mb-1">Предметы</h3>
          <p class="text-muted mb-0">Сгруппированные по предметам группы</p>
        </div>
        <button class="btn btn-outline-primary" onclick="demoAction('добавить предмет')"><i class="bi bi-plus-lg"></i> Добавить предмет</button>
      </div>

      <div id="subj-accordion" class="accordion"></div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
CURRENT_USER.role = 'teacher';
mountHeader();
document.getElementById('app-sidebar').innerHTML = renderTeacherSidebar('subjects');

document.getElementById('subj-accordion').innerHTML = SUBJECTS.map((s, i) => {
  const groups = GROUPS.filter(g => g.subjectId === s.id);
  return `<div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button ${i?'collapsed':''}" type="button"
              data-bs-toggle="collapse" data-bs-target="#subj-${s.id}">
        <span class="feature-icon me-2 mb-0" style="width:34px;height:34px;font-size:.9rem;">📚</span>
        <strong>${s.name}</strong>
        <span class="badge badge-group ms-2">${groups.length} групп</span>
      </button>
    </h2>
    <div id="subj-${s.id}" class="accordion-collapse collapse ${i?'':'show'}">
      <div class="accordion-body p-0">
        ${groups.length ? `<table class="table table-sm align-middle mb-0">
          <thead class="table-light"><tr><th>Группа</th><th>Уровень</th><th>Студентов</th><th class="text-end">Действие</th></tr></thead>
          <tbody>${groups.map(g => `<tr>
            <td><a href="gradebook.html?group=${g.id}" class="fw-semibold">${g.name}</a></td>
            <td><span class="badge ${g.level==='Магистратура'?'badge-role-teacher':'badge-role-student'}">${g.level}</span></td>
            <td>${g.students}</td>
            <td class="text-end"><a href="gradebook.html?group=${g.id}" class="btn btn-sm btn-outline-primary">Журнал</a></td>
          </tr>`).join('')}</tbody>
        </table>` : '<div class="empty-state"><p class="mb-0 text-muted">Нет групп по этому предмету</p></div>'}
      </div>
    </div>
  </div>`;
}).join('');
</script>
</body>
</html>
