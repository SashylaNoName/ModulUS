<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ModulUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('modulus-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

<div class="animated-bg"></div>

<nav class="navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Modul<span class="brand-dot">US</span></a>
    <div class="d-flex align-items-center gap-2">
      <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему"></button>
      <a href="register.html" class="btn btn-outline-primary btn-sm d-none d-sm-inline-block">Регистрация</a>
    </div>
  </div>
</nav>

<div class="container" style="min-height:calc(100vh - 70px);display:flex;align-items:center;padding:2rem 0;">
  <div class="glass w-100 mx-auto" style="max-width:460px;padding:2.5rem;" data-reveal="scale">
    <h3 class="fw-bold text-center mb-1">С возвращением 👋</h3>
    <p style="color:var(--text-muted);" class="text-center mb-4">Войдите в свой аккаунт ModulUS</p>

    <label class="form-label fw-semibold">Я захожу как:</label>
    <div class="row g-2 mb-4">
      <div class="col-6">
        <label class="role-pick d-block text-center">
          <input type="radio" name="role" value="teacher" class="d-none" checked>
          <div class="fs-3">👩‍🏫</div>
          <div class="fw-semibold">Преподаватель</div>
          <small style="color:var(--text-muted);">Журнал, группы</small>
        </label>
      </div>
      <div class="col-6">
        <label class="role-pick d-block text-center">
          <input type="radio" name="role" value="student" class="d-none">
          <div class="fs-3">🎓</div>
          <div class="fw-semibold">Студент</div>
          <small style="color:var(--text-muted);">Оценки, предметы</small>
        </label>
      </div>
    </div>

    <form onsubmit="return doLogin(event)">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" placeholder="you@university.ru"
                 value="ivanova@university.ru" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="pass" placeholder="••••••••" value="demo1234" required>
          <button class="btn btn-outline-secondary" type="button" onclick="togglePass(this)">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember" checked>
          <label class="form-check-label small" for="remember">Запомнить меня</label>
        </div>
        <a href="#" class="small" onclick="toast('В Laravel здесь форма восстановления пароля','info');return false;">
          Забыли пароль?
        </a>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">Войти</button>
    </form>

    <hr class="my-4">
    <div class="text-center small" style="color:var(--text-muted);">
      Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
function togglePass(btn) {
  const input = document.getElementById('pass');
  const icon = btn.querySelector('i');
  if (input.type === 'password') { input.type = 'text'; icon.className = 'bi bi-eye-slash'; }
  else { input.type = 'password'; icon.className = 'bi bi-eye'; }
}
function doLogin(e) {
  e.preventDefault();
  const role = document.querySelector('input[name=role]:checked').value;
  toast('Вход выполнен как ' + (role === 'teacher' ? 'преподаватель' : 'студент'), 'success');
  setTimeout(() => location.href = role === 'teacher' ? 'teacher-dashboard.html' : 'student-dashboard.html', 700);
  return false;
}
initPage();
</script>
</body>
</html>
