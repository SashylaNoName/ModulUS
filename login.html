<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ModulUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      Modul<span class="brand-dot" style="color:var(--primary);">US</span>
    </a>
    <a href="register.html" class="btn btn-outline-primary btn-sm">Нет аккаунта? Регистрация</a>
  </div>
</nav>

<div class="auth-wrap container">
  <div class="auth-card card border-0 shadow-sm w-100">
    <div class="card-body p-4 p-md-5">
      <h3 class="fw-bold text-center mb-1">С возвращением 👋</h3>
      <p class="text-muted text-center mb-4">Войдите в свой аккаунт ModulUS</p>

      <!-- Выбор роли -->
      <label class="form-label fw-semibold">Я захожу как:</label>
      <div class="row g-2 mb-4">
        <div class="col-6">
          <label class="role-pick d-block">
            <input type="radio" name="role" value="teacher" class="d-none" checked>
            <div class="role-pick-body text-center">
              <div class="fs-3">👩‍🏫</div>
              <div class="fw-semibold">Преподаватель</div>
              <small class="text-muted">Журнал, группы, баллы</small>
            </div>
          </label>
        </div>
        <div class="col-6">
          <label class="role-pick d-block">
            <input type="radio" name="role" value="student" class="d-none">
            <div class="role-pick-body text-center">
              <div class="fs-3">🎓</div>
              <div class="fw-semibold">Студент</div>
              <small class="text-muted">Оценки, предметы</small>
            </div>
          </label>
        </div>
      </div>

      <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" placeholder="you@university.ru"
                   value="ivanova@university.ru" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" placeholder="••••••••" value="demo1234" required>
            <button class="btn btn-outline-secondary" type="button" onclick="togglePass(this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" checked>
            <label class="form-check-label small" for="remember">Запомнить меня</label>
          </div>
          <a href="#" class="small" onclick="toast('В Laravel здесь форма восстановления пароля','info');return false;">
            Забыли пароль?
          </a>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Войти</button>
      </form>

      <hr class="my-4">
      <div class="text-center small text-muted">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
function togglePass(btn) {
  const input = btn.parentElement.querySelector('input');
  const icon = btn.querySelector('i');
  if (input.type === 'password') { input.type = 'text'; icon.className = 'bi bi-eye-slash'; }
  else { input.type = 'password'; icon.className = 'bi bi-eye'; }
}
function doLogin(e) {
  e.preventDefault();
  const role = document.querySelector('input[name=role]:checked').value;
  toast('Вход выполнен как ' + (role === 'teacher' ? 'преподаватель' : 'студент') + ' — демо-режим', 'success');
  setTimeout(() => {
    window.location.href = role === 'teacher' ? 'teacher-dashboard.html' : 'student-dashboard.html';
  }, 700);
  return false;
}
</script>
</body>
</html>
