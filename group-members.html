<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Студенты группы — ModulUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('modulus-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div id="app-header"></div>

<div class="container-fluid">
  <div class="row g-0">
    <div class="col-lg-2 col-md-3" id="app-sidebar"></div>
    <div class="col-lg-10 col-md-9 p-3 p-md-4">

      <div class="d-flex align-items-center mb-3" data-reveal>
        <a href="groups.html" class="btn btn-light me-2"><i class="bi bi-arrow-left"></i></a>
        <div><h3 class="fw-bold mb-0" id="page-title">Студенты</h3>
        <span class="small" style="color:var(--text-muted);" id="page-sub"></span></div>
      </div>

      <div class="d-flex flex-wrap gap-2 mb-4" data-reveal>
        <button class="btn btn-primary" onclick="openAdd()"><i class="bi bi-person-plus"></i> Добавить</button>
        <button class="btn btn-outline-primary" onclick="openInvite()"><i class="bi bi-link-45deg"></i> Ссылка</button>
        <button class="btn btn-outline-primary" onclick="openImport()"><i class="bi bi-file-earmark-spreadsheet"></i> Импорт Excel</button>
        <a href="gradebook.html" class="btn btn-light"><i class="bi bi-table"></i> Журнал</a>
      </div>

      <div class="card" data-reveal>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light"><tr>
                <th style="width:50px;">#</th><th>Студент</th><th>Email</th><th>Статус</th><th class="text-end">Действия</th>
              </tr></thead>
              <tbody id="members-body"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- модалки: добавить / ссылка / импорт -->
<div class="modal fade" id="addModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Добавить студента</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div class="mb-3"><label class="form-label">ФИО</label><input type="text" class="form-control" placeholder="Иванов Иван Иванович"></div>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" placeholder="ivanov@stud.ru"></div>
  </div>
  <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Отмена</button>
    <button class="btn btn-primary" onclick="demoAction('добавить студента');bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();">Добавить</button></div>
</div></div></div>

<div class="modal fade" id="inviteModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Ссылка-приглашение</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <p style="color:var(--text-muted);" class="small">Поделитесь ссылкой со студентами. После присоединения придёт уведомление.</p>
    <div class="input-group"><input type="text" class="form-control" id="invite-link" readonly>
      <button class="btn btn-outline-primary" onclick="copyInvite()"><i class="bi bi-clipboard"></i> Копировать</button></div>
    <div class="form-text mt-2">Срок действия — 30 дней.</div>
  </div>
</div></div></div>

<div class="modal fade" id="importModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Импорт студентов из Excel</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div class="mb-3"><label class="form-label">Файл Excel (.xlsx)</label><input type="file" class="form-control" accept=".xlsx,.xls"></div>
    <div class="alert alert-info small mb-0"><b>Требования:</b><br>Колонка A — ФИО, колонка B — email. Первая строка — заголовок (пропускается).</div>
  </div>
  <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Отмена</button>
    <button class="btn btn-primary" onclick="demoAction('импорт Excel');bootstrap.Modal.getInstance(document.getElementById('importModal')).hide();">Импортировать</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
CURRENT_USER.role = 'teacher';
mountHeader();
document.getElementById('app-sidebar').innerHTML = renderTeacherSidebar('groups');

const gid = Number(new URLSearchParams(location.search).get('group') || 1);
const group = getGroup(gid);
const subj = getSubject(group.subjectId);
document.getElementById('page-title').textContent = 'Студенты группы ' + group.name;
document.getElementById('page-sub').textContent = subj.name + ' · ' + group.level;
document.getElementById('invite-link').value = group.inviteLink;

const list = STUDENTS.filter(s => s.group === gid);
document.getElementById('members-body').innerHTML = list.map((s, i) => `
  <tr>
    <td>${i+1}</td>
    <td><div class="d-flex align-items-center gap-2">
      <span class="avatar avatar-sm">${s.avatar}</span><span class="fw-semibold">${s.name}</span></div></td>
    <td>${s.email}</td>
    <td><span class="badge badge-role-student">Активен</span></td>
    <td class="text-end">
      <button class="btn btn-sm btn-light" onclick="demoAction('редактировать студента')"><i class="bi bi-pencil"></i></button>
      <button class="btn btn-sm btn-light text-danger" onclick="demoAction('исключить студента')"><i class="bi bi-x-lg"></i></button>
    </td>
  </tr>`).join('');

function openAdd()    { new bootstrap.Modal(document.getElementById('addModal')).show(); }
function openInvite() { new bootstrap.Modal(document.getElementById('inviteModal')).show(); }
function openImport() { new bootstrap.Modal(document.getElementById('importModal')).show(); }
function copyInvite() {
  const inp = document.getElementById('invite-link'); inp.select();
  navigator.clipboard?.writeText(inp.value); toast('Ссылка скопирована', 'success');
}
initPage();
</script>
</body>
</html>
