<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Главная — ModulUS (Студент)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('modulus-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div id="app-header"></div>

<div class="container-fluid">
  <div class="row g-0">
    <div class="col-lg-2 col-md-3" id="app-sidebar"></div>
    <div class="col-lg-10 col-md-9 p-3 p-md-4">

      <div data-reveal>
        <h3 class="fw-bold mb-1">Здравствуйте, Артём! 👋</h3>
        <p style="color:var(--text-muted);">Группа <b>ПИб-231</b> · Бакалавриат · 3 семестр</p>
      </div>

      <div class="row g-3 mb-4" id="stats"></div>

      <h5 class="fw-bold mb-3" data-reveal>Мои предметы</h5>
      <div class="row g-3 mb-4" id="subj-cards"></div>

      <div class="card" data-reveal>
        <div class="card-header bg-transparent d-flex justify-content-between align-items-center" style="border-color:var(--border);">
          <strong>Последние оценки и комментарии</strong>
          <a href="student-grades.html" class="small">Все →</a>
        </div>
        <div class="list-group list-group-flush" id="recent-list"></div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
CURRENT_USER.role = 'student';
CURRENT_USER.name = 'Алексеев Артём Дмитриевич';
CURRENT_USER.avatar = 'АА';
mountHeader();
document.getElementById('app-sidebar').innerHTML = renderStudentSidebar('dashboard');

document.getElementById('stats').innerHTML =
  statCard('📊', 'отл', 'Средний балл', 1) +
  statCard('📈', '68', 'Сумма из 100', 2) +
  statCard('💬', 2, 'Комментария', 3) +
  statCard('📚', 5, 'Предметов', 4);

document.getElementById('subj-cards').innerHTML = SUBJECTS.map((s, i) => `
  <div class="col-md-6 col-lg-4" data-reveal data-delay="${(i%3)+1}">
    <a href="student-subject.html?subject=${s.id}" class="card feature-card h-100 text-decoration-none" style="color:var(--text);">
      <div class="feature-icon soft" style="width:44px;height:44px;font-size:1.1rem;">📚</div>
      <h6 class="fw-bold mb-1">${s.name}</h6>
      <div class="small" style="color:var(--text-muted);">Иванова М. П.</div>
    </a>
  </div>`).join('');

const events = [
  { icon:'📊', text:'Получена оценка <b>«отл»</b> за <b>Итог</b> (Программирование)', time:'10 мин назад' },
  { icon:'💬', text:'Новый комментарий к <b>ЛР 1</b>', time:'2 часа назад' },
  { icon:'📊', text:'Получен балл <b>25</b> за <b>2 модуль</b>', time:'вчера' },
];
document.getElementById('recent-list').innerHTML = events.map(e => `
  <div class="list-group-item d-flex gap-3 align-items-center">
    <span class="fs-4">${e.icon}</span>
    <div class="flex-grow-1"><div class="small">${e.text}</div></div>
    <span style="color:var(--text-soft);font-size:.72rem;">${e.time}</span>
  </div>`).join('');

initPage();
</script>
</body>
</html>
