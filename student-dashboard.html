<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Главная — ModulUS (Студент)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-header"></div>

<div class="container-fluid">
  <div class="row">
    <div class="col-lg-2 col-md-3 p-0" id="app-sidebar"></div>
    <div class="col-lg-10 col-md-9 p-4">

      <h3 class="fw-bold mb-1">Здравствуйте, Артём! 👋</h3>
      <p class="text-muted">Группа <b>ПИб-231</b> · Бакалавриат · 3 семестр</p>

      <!-- сводные карточки -->
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="card p-3 text-center">
            <div class="fs-2 fw-bold text-primary">отл</div>
            <small class="text-muted">Средний балл (итог)</small>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card p-3 text-center">
            <div class="fs-2 fw-bold">68</div>
            <small class="text-muted">Сумма баллов из 100</small>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card p-3 text-center">
            <div class="fs-2 fw-bold text-warning">2</div>
            <small class="text-muted">Новых комментария</small>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card p-3 text-center">
            <div class="fs-2 fw-bold text-success">5</div>
            <small class="text-muted">Предметов</small>
          </div>
        </div>
      </div>

      <!-- предметы -->
      <h5 class="fw-bold mb-3">Мои предметы</h5>
      <div class="row g-3 mb-4" id="subj-cards"></div>

      <!-- последние оценки -->
      <div class="card">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
          <strong>Последние оценки и комментарии</strong>
          <a href="student-grades.html" class="small">Все оценки →</a>
        </div>
        <div class="list-group list-group-flush" id="recent-list"></div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
CURRENT_USER.role = 'student';
CURRENT_USER.name = 'Алексеев Артём Дмитриевич';
CURRENT_USER.avatar = 'АА';
mountHeader();
document.getElementById('app-sidebar').innerHTML = renderStudentSidebar('dashboard');

// карточки предметов
document.getElementById('subj-cards').innerHTML = SUBJECTS.map(s => `
  <div class="col-md-6 col-lg-4">
    <a href="student-subject.html?subject=${s.id}" class="card card-hover h-100 text-decoration-none text-dark">
      <div class="card-body">
        <div class="feature-icon mb-2" style="width:44px;height:44px;font-size:1.1rem;">📚</div>
        <h6 class="fw-bold mb-1">${s.name}</h6>
        <div class="d-flex justify-content-between small text-muted">
          <span>Преподаватель: Иванова М. П.</span>
        </div>
        <div class="mt-2"><span class="badge badge-role-student">Активен</span></div>
      </div>
    </a>
  </div>`).join('');

// последние события
const events = [
  { icon: '📊', text: 'Получена оценка <b>«отл»</b> за <b>Итог</b> (Программирование)', time: '10 мин назад' },
  { icon: '💬', text: 'Новый комментарий от преподавателя к <b>ЛР 1</b>', time: '2 часа назад' },
  { icon: '📊', text: 'Получен балл <b>25</b> за <b>2 модуль</b> (Программирование)', time: 'вчера' },
];
document.getElementById('recent-list').innerHTML = events.map(e => `
  <div class="list-group-item d-flex gap-3 align-items-center">
    <span class="fs-4">${e.icon}</span>
    <div class="flex-grow-1"><div class="small">${e.text}</div></div>
    <span class="text-muted" style="font-size:.72rem;">${e.time}</span>
  </div>`).join('');
</script>
</body>
</html>
