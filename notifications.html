<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Уведомления — ModulUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('modulus-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div id="app-header"></div>

<div class="container-fluid">
  <div class="row g-0">
    <div class="col-lg-2 col-md-3" id="app-sidebar"></div>
    <div class="col-lg-10 col-md-9 p-3 p-md-4">

      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4" data-reveal>
        <div><h3 class="fw-bold mb-1">Уведомления</h3>
        <p class="mb-0" style="color:var(--text-muted);" id="notif-sub"></p></div>
        <button class="btn btn-outline-secondary btn-sm" onclick="markAllRead()">
          <i class="bi bi-check2-all"></i> Прочитать все
        </button>
      </div>

      <div class="btn-group mb-3" role="group" data-reveal>
        <button class="btn btn-outline-primary btn-sm active" onclick="filterNotif(this,'all')">Все</button>
        <button class="btn btn-outline-primary btn-sm" onclick="filterNotif(this,'unread')">Непрочитанные</button>
      </div>

      <div class="card" data-reveal>
        <div class="card-body p-0" id="notif-container"></div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
CURRENT_USER.role = savedRole();
if (CURRENT_USER.role === 'student') {
  CURRENT_USER.name = 'Алексеев Артём Дмитриевич';
  CURRENT_USER.avatar = 'АА';
}
mountHeader();
document.getElementById('app-sidebar').innerHTML =
  CURRENT_USER.role === 'teacher' ? renderTeacherSidebar('notif') : renderStudentSidebar('notif');

let notifList = JSON.parse(JSON.stringify(
  CURRENT_USER.role === 'teacher' ? NOTIFICATIONS_TEACHER : NOTIFICATIONS_STUDENT
));
document.getElementById('notif-sub').textContent = CURRENT_USER.role === 'teacher'
  ? 'Студенты по ссылке и ответы на ваши комментарии'
  : 'Новые оценки и комментарии преподавателей';

function renderNotif(filter = 'all') {
  const items = notifList.filter(n => filter === 'all' ? true : n.unread);
  const container = document.getElementById('notif-container');
  if (!items.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon"><i class="bi bi-bell-slash"></i></div><p class="mb-0">Нет уведомлений</p></div>`;
    return;
  }
  container.innerHTML = items.map(n => `
    <div class="notif-item d-flex gap-3 ${n.unread?'unread':''}">
      <span class="fs-4">${n.icon}</span>
      <div class="flex-grow-1">
        <div class="d-flex justify-content-between">
          <strong>${n.title} ${n.unread?'<span class="pulse ms-1"></span>':''}</strong>
          <span class="small" style="color:var(--text-soft);">${n.time}</span>
        </div>
        <div class="small mt-1" style="color:var(--text-muted);">${n.text}</div>
      </div>
    </div>`).join('');
}
function filterNotif(btn, f) {
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderNotif(f);
}
function markAllRead() {
  notifList.forEach(n => n.unread = false);
  renderNotif();
  toast('Все уведомления отмечены прочитанными', 'success');
}
renderNotif();
initPage();
</script>
</body>
</html>
