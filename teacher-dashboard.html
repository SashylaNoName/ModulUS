<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Главная — ModulUS (Преподаватель)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-header"></div>

<div class="container-fluid">
  <div class="row">
    <div class="col-lg-2 col-md-3 p-0" id="app-sidebar"></div>
    <div class="col-lg-10 col-md-9 p-4">

      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold mb-1">Здравствуйте, Мария Петровна! 👋</h3>
          <p class="text-muted mb-0">Сводка по вашим предметам и группам</p>
        </div>
        <a href="group-form.html" class="btn btn-primary">
          <i class="bi bi-plus-lg"></i> Создать группу
        </a>
      </div>

      <!-- Карточки статистики -->
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="card p-3">
            <div class="d-flex align-items-center">
              <div class="feature-icon mb-0 me-3" style="width:48px;height:48px;font-size:1.2rem;">📚</div>
              <div>
                <div class="fs-4 fw-bold lh-1">5</div>
                <small class="text-muted">Предметов</small>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card p-3">
            <div class="d-flex align-items-center">
              <div class="feature-icon mb-0 me-3" style="width:48px;height:48px;font-size:1.2rem;">👥</div>
              <div>
                <div class="fs-4 fw-bold lh-1">4</div>
                <small class="text-muted">Групп</small>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card p-3">
            <div class="d-flex align-items-center">
              <div class="feature-icon mb-0 me-3" style="width:48px;height:48px;font-size:1.2rem;">🎓</div>
              <div>
                <div class="fs-4 fw-bold lh-1">86</div>
                <small class="text-muted">Студентов</small>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card p-3">
            <div class="d-flex align-items-center">
              <div class="feature-icon mb-0 me-3" style="width:48px;height:48px;font-size:1.2rem;">🔔</div>
              <div>
                <div class="fs-4 fw-bold lh-1">3</div>
                <small class="text-muted">Новых уведомлений</small>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Последние группы -->
      <div class="card">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
          <strong>Мои группы</strong>
          <a href="groups.html" class="small">Все группы →</a>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Группа</th>
                  <th>Предмет</th>
                  <th>Уровень</th>
                  <th>Студентов</th>
                  <th class="text-end">Действия</th>
                </tr>
              </thead>
              <tbody id="dash-groups"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
CURRENT_USER.role = 'teacher';
mountHeader();
document.getElementById('app-sidebar').innerHTML = renderTeacherSidebar('dashboard');

document.getElementById('dash-groups').innerHTML = GROUPS.map(g => {
  const subj = getSubject(g.subjectId);
  return `<tr>
    <td><a href="gradebook.html?group=${g.id}" class="fw-semibold">${g.name}</a></td>
    <td>${subj.name}</td>
    <td><span class="badge ${g.level==='Магистратура'?'badge-role-teacher':'badge-role-student'}">${g.level}</span></td>
    <td>${g.students}</td>
    <td class="text-end">
      <a href="gradebook.html?group=${g.id}" class="btn btn-sm btn-outline-primary">Журнал</a>
      <a href="group-form.html?id=${g.id}" class="btn btn-sm btn-light"><i class="bi bi-pencil"></i></a>
    </td>
  </tr>`;
}).join('');
</script>
</body>
</html>
