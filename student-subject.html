<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Предмет — ModulUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('modulus-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div id="app-header"></div>

<div class="container-fluid">
  <div class="row g-0">
    <div class="col-lg-2 col-md-3" id="app-sidebar"></div>
    <div class="col-lg-10 col-md-9 p-3 p-md-4">

      <div class="d-flex align-items-center mb-3" data-reveal>
        <a href="student-subjects.html" class="btn btn-light me-2"><i class="bi bi-arrow-left"></i></a>
        <div><h3 class="fw-bold mb-0" id="subj-title">Предмет</h3>
        <span class="small" style="color:var(--text-muted);">Иванова М. П. · Группа ПИб-231</span></div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-3 col-6" data-reveal data-delay="1"><div class="glass p-3 text-center h-100">
          <div class="fs-3 fw-bold text-gradient" id="m1">23</div><small style="color:var(--text-muted);">1 модуль</small></div></div>
        <div class="col-md-3 col-6" data-reveal data-delay="2"><div class="glass p-3 text-center h-100">
          <div class="fs-3 fw-bold text-gradient" id="m2">25</div><small style="color:var(--text-muted);">2 модуль</small></div></div>
        <div class="col-md-3 col-6" data-reveal data-delay="3"><div class="glass p-3 text-center h-100">
          <div class="fs-3 fw-bold text-gradient" id="m3">20</div><small style="color:var(--text-muted);">3 модуль</small></div></div>
        <div class="col-md-3 col-6" data-reveal data-delay="4"><div class="glass p-3 text-center h-100" style="background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(245,158,11,.05));">
          <div class="fs-3 fw-bold" style="color:#b45309;" id="total">отл</div><small style="color:var(--text-muted);">Итог</small></div></div>
      </div>

      <div class="row g-4">
        <div class="col-lg-7" data-reveal="left">
          <div class="card h-100">
            <div class="card-header bg-transparent" style="border-color:var(--border);"><strong>Мои баллы</strong></div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-sm align-middle mb-0 grade-table">
                  <thead><tr><th>Столбец</th><th class="text-center">Балл</th><th class="text-center">💬</th></tr></thead>
                  <tbody id="grades-body"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-5" data-reveal="right">
          <div class="card h-100">
            <div class="card-header bg-transparent" style="border-color:var(--border);"><strong>Комментарии преподавателя</strong></div>
            <div class="card-body" id="threads"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal fade" id="replyModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Ответить преподавателю</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div class="small mb-2" style="color:var(--text-muted);" id="reply-context"></div>
    <div id="reply-thread" class="mb-3"></div>
    <label class="form-label">Ваш ответ</label>
    <textarea class="form-control" rows="3" id="reply-text" placeholder="Напишите ответ..."></textarea>
  </div>
  <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Отмена</button>
    <button class="btn btn-primary" onclick="sendReply()">Отправить</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
CURRENT_USER.role = 'student';
CURRENT_USER.name = 'Алексеев Артём Дмитриевич';
CURRENT_USER.avatar = 'АА';
mountHeader();
document.getElementById('app-sidebar').innerHTML = renderStudentSidebar('subjects');

const subjId = Number(new URLSearchParams(location.search).get('subject') || 1);
const subj = getSubject(subjId);
document.getElementById('subj-title').textContent = subj.name;

const SID = 1;
document.getElementById('grades-body').innerHTML = COLUMN_STRUCTURE.map(c => {
  const g = GRADES[SID + '_' + c.id] || { value: '—' };
  const thread = getCommentByCell(SID + '_' + c.id);
  let cls = ''; if (c.type==='module') cls='col-module'; if (c.type==='total') cls='col-total';
  return `<tr>
    <td class="${cls}">${c.title}</td>
    <td class="cell-grade ${cls}"><b>${g.value || '—'}</b></td>
    <td class="text-center">${thread
      ? `<button class="btn btn-sm btn-link p-0" style="color:var(--warning);" onclick="openReply('${SID}_${c.id}')"><i class="bi bi-chat-dots-fill"></i> <span class="small">${thread.thread.length}</span></button>`
      : '<span style="color:var(--text-soft);">—</span>'}</td>
  </tr>`;
}).join('');

const myComments = COMMENTS.filter(c => c.cellKey.startsWith(SID + '_'));
document.getElementById('threads').innerHTML = myComments.length
  ? myComments.map(c => {
      const col = COLUMN_STRUCTURE.find(x => x.id === c.cellKey.split('_')[1]);
      return `<div class="mb-3">
        <div class="small mb-1" style="color:var(--text-muted);">Столбец: <b>${col.title}</b></div>
        <div class="comment-thread">${c.thread.map(m => `<div class="comment-bubble ${m.author==='teacher'?'teacher':''}">
          <strong class="small">${m.name}</strong> <span style="color:var(--text-soft);font-size:.7rem;">${m.time}</span>
          <div class="small">${m.text}</div></div>`).join('')}</div>
        <button class="btn btn-sm btn-outline-primary mt-1" onclick="openReply('${c.cellKey}')"><i class="bi bi-reply"></i> Ответить</button>
      </div>`;
    }).join('')
  : '<div class="empty-state"><div class="empty-icon"><i class="bi bi-chat"></i></div><p class="mb-0">Комментариев пока нет</p></div>';

function openReply(cellKey) {
  const col = COLUMN_STRUCTURE.find(x => x.id === cellKey.split('_')[1]);
  const thread = getCommentByCell(cellKey);
  document.getElementById('reply-context').textContent = 'Столбец: ' + col.title;
  document.getElementById('reply-thread').innerHTML = thread
    ? '<div class="comment-thread">' + thread.thread.map(m => `<div class="comment-bubble ${m.author==='teacher'?'teacher':''}">
        <strong class="small">${m.name}</strong><div class="small">${m.text}</div></div>`).join('') + '</div>' : '';
  document.getElementById('reply-text').value = '';
  new bootstrap.Modal(document.getElementById('replyModal')).show();
}
function sendReply() {
  if (!document.getElementById('reply-text').value.trim()) return;
  toast('Ответ отправлен преподавателю (демо)', 'success');
  bootstrap.Modal.getInstance(document.getElementById('replyModal')).hide();
}
initPage();
</script>
</body>
</html>
