<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Предмет — ModulUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('modulus-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div id="app-header"></div>

<div class="container-fluid">
  <div class="row g-0">
    <div class="col-lg-2 col-md-3" id="app-sidebar"></div>
    <div class="col-lg-10 col-md-9 p-3 p-md-4">

      <div class="d-flex align-items-center mb-3" data-reveal>
        <a href="student-subjects.html" class="btn btn-light me-2"><i class="bi bi-arrow-left"></i></a>
        <div><h3 class="fw-bold mb-0" id="subj-title">Предмет</h3>
        <span class="small" style="color:var(--text-muted);">Иванова М. П. · Группа ПИб-231</span></div>
      </div>

      <!-- горизонтальная таблица баллов -->
      <div class="card mb-4" data-reveal>
        <div class="card-header bg-transparent d-flex justify-content-between align-items-center" style="border-color:var(--border);">
          <strong>Мои баллы</strong>
          <span class="small" style="color:var(--text-muted);">Кликните по ячейке, чтобы открыть диалог</span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-bordered grade-table mb-0 align-middle">
              <thead id="grade-head"></thead>
              <tbody id="grade-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- список активных диалогов -->
      <div class="card" data-reveal>
        <div class="card-header bg-transparent" style="border-color:var(--border);"><strong>Диалоги с преподавателем</strong></div>
        <div class="card-body" id="threads"></div>
      </div>

    </div>
  </div>
</div>

<!-- ===== Чат к полю ===== -->
<div class="modal fade" id="chatModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title"><i class="bi bi-chat-dots text-gradient"></i> Диалог по оценке</h5>
    <button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div class="small mb-2" style="color:var(--text-muted);" id="chat-context"></div>
    <div id="chat-thread" class="mb-3" style="max-height:320px;overflow:auto;"></div>
    <!-- форма отправки -->
    <div class="border-top pt-3">
      <textarea class="form-control mb-2" rows="2" id="chat-text" placeholder="Напишите сообщение..."></textarea>
      <div class="d-flex gap-2">
        <button class="btn btn-light" onclick="demoAction('прикрепить файл')" title="Прикрепить файл">
          <i class="bi bi-paperclip"></i> Файл</button>
        <button class="btn btn-light" onclick="demoAction('прикрепить фото')" title="Прикрепить фото">
          <i class="bi bi-image"></i> Фото</button>
        <button class="btn btn-primary ms-auto" onclick="sendChat()"><i class="bi bi-send"></i> Отправить</button>
      </div>
    </div>
  </div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
CURRENT_USER.role = 'student'; saveRole('student');
CURRENT_USER.name = 'Алексеев Артём Дмитриевич';
CURRENT_USER.avatar = 'АА';
mountHeader();
document.getElementById('app-sidebar').innerHTML = renderStudentSidebar('subjects');

const subjId = Number(new URLSearchParams(location.search).get('subject') || 1);
const subj = getSubject(subjId);
document.getElementById('subj-title').textContent = subj.name;

const SID = 1; // текущий студент

// студент видит только столбцы, НЕ скрытые преподавателем
const VISIBLE_COLS = COLUMN_STRUCTURE.filter(c => !c.hidden);

// заголовки таблицы
document.getElementById('grade-head').innerHTML =
  '<tr><th class="sticky-column" style="min-width:180px;left:0;">Вид контроля</th>' +
  VISIBLE_COLS.map(c => `<th class="${c.type==='module'?'col-module':''}${c.type==='total'?'col-total':''}">${c.title}</th>`).join('') +
  '</tr>';

// одна строка с баллами студента (горизонтальная)
document.getElementById('grade-body').innerHTML = '<tr>' +
  '<td class="sticky-column fw-semibold" style="min-width:180px;left:0;">Балл</td>' +
  VISIBLE_COLS.map(c => {
    const cellKey = SID + '_' + c.id;
    const g = GRADES[cellKey] || { value: '—' };
    const hasThread = !!getCommentByCell(cellKey);
    const cls = c.type==='module'?'col-module':c.type==='total'?'col-total':'';
    const val = g.value || '—';
    return `<td class="cell-grade cursor-pointer ${cls}" onclick="openChat('${cellKey}')">
      <div class="d-flex align-items-center justify-content-center gap-1">
        <b>${val}</b>
        ${hasThread ? '<i class="bi bi-chat-dots-fill" style="color:var(--brand-1);font-size:.8rem;"></i>' : '<i class="bi bi-chat" style="color:var(--text-soft);font-size:.8rem;"></i>'}
      </div>
    </td>`;
  }).join('') + '</tr>';

// список диалогов
const myComments = COMMENTS.filter(c => c.cellKey.startsWith(SID + '_'));
document.getElementById('threads').innerHTML = myComments.length
  ? myComments.map(c => {
      const col = COLUMN_STRUCTURE.find(x => x.id === c.cellKey.split('_')[1]);
      return `<div class="mb-3">
        <div class="small mb-1" style="color:var(--text-muted);">Столбец: <b>${col.title}</b></div>
        ${renderThread(c.cellKey)}
        <button class="btn btn-sm btn-outline-primary mt-1" onclick="openReply('${c.cellKey}')"><i class="bi bi-reply"></i> Ответить</button>
      </div>`;
    }).join('')
  : '<div class="empty-state"><div class="empty-icon"><i class="bi bi-chat"></i></div><p class="mb-0">Диалогов пока нет</p></div>';

// чат
let currentChat = null;
function openChat(cellKey) {
  currentChat = cellKey;
  const col = COLUMN_STRUCTURE.find(x => x.id === cellKey.split('_')[1]);
  const g = GRADES[cellKey] || {};
  document.getElementById('chat-context').innerHTML = `Столбец: <b>${col.title}</b> · Ваш балл: <b>${g.value || '—'}</b>`;
  document.getElementById('chat-thread').innerHTML = renderThread(cellKey);
  document.getElementById('chat-text').value = '';
  new bootstrap.Modal(document.getElementById('chatModal')).show();
}
function openReply(cellKey) { openChat(cellKey); }
function sendChat() {
  if (!document.getElementById('chat-text').value.trim()) return;
  toast('Сообщение отправлено преподавателю (демо)', 'success');
  bootstrap.Modal.getInstance(document.getElementById('chatModal')).hide();
}
initPage();
</script>
</body>
</html>
