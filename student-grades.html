<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои оценки — ModulUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-header"></div>

<div class="container-fluid">
  <div class="row">
    <div class="col-lg-2 col-md-3 p-0" id="app-sidebar"></div>
    <div class="col-lg-10 col-md-9 p-4">

      <h3 class="fw-bold mb-1">Мои оценки</h3>
      <p class="text-muted mb-4">Сводная таблица баллов по всем предметам</p>

      <div class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-bordered align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Предмет</th>
                  <th class="text-center">1 модуль</th>
                  <th class="text-center">2 модуль</th>
                  <th class="text-center">3 модуль</th>
                  <th class="text-center">Итог</th>
                  <th class="text-center">Комментарии</th>
                </tr>
              </thead>
              <tbody id="overview"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
CURRENT_USER.role = 'student';
CURRENT_USER.name = 'Алексеев Артём Дмитриевич';
CURRENT_USER.avatar = 'АА';
mountHeader();
document.getElementById('app-sidebar').innerHTML = renderStudentSidebar('grades');

// демо-сводка по предметам
const summary = [
  { name: 'Программирование',   m1: 23, m2: 25, m3: 20, total: 'отл',    comments: 2 },
  { name: 'Высшая математика',  m1: 18, m2: 17, m3: 19, total: 'хор',    comments: 0 },
  { name: 'Базы данных',        m1: 25, m2: 26, m3: 27, total: 'отл',    comments: 1 },
  { name: 'Английский язык',    m1: 'зачёт', m2: 'зачёт', m3: 'зачёт', total: 'зачёт', comments: 0 },
  { name: 'Физика',             m1: 12, m2: 13, m3: 14, total: 'удовл',  comments: 1 },
];

document.getElementById('overview').innerHTML = summary.map(s => `
  <tr>
    <td><a href="student-subject.html?subject=1" class="fw-semibold text-decoration-none">${s.name}</a></td>
    <td class="text-center">${s.m1}</td>
    <td class="text-center">${s.m2}</td>
    <td class="text-center">${s.m3}</td>
    <td class="text-center"><span class="badge ${s.total==='отл'?'badge-role-student':s.total==='удовл'?'badge-role-teacher':'badge-group'}">${s.total}</span></td>
    <td class="text-center">${s.comments ? `<span class="badge bg-warning text-dark">${s.comments} 💬</span>` : '<span class="text-muted">—</span>'}</td>
  </tr>`).join('');
</script>
</body>
</html>
