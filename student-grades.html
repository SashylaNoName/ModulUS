<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои оценки — ModulUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('modulus-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div id="app-header"></div>

<div class="container-fluid">
  <div class="row g-0">
    <div class="col-lg-2 col-md-3" id="app-sidebar"></div>
    <div class="col-lg-10 col-md-9 p-3 p-md-4">

      <div data-reveal>
        <h3 class="fw-bold mb-1">Мои оценки</h3>
        <p style="color:var(--text-muted);" class="mb-4">Сводная таблица баллов по всем предметам</p>
      </div>

      <div class="card" data-reveal>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-bordered align-middle mb-0">
              <thead class="table-light">
                <tr><th>Предмет</th><th class="text-center">1 модуль</th><th class="text-center">2 модуль</th>
                <th class="text-center">3 модуль</th><th class="text-center">Итоги*</th>
                <th class="text-center">Экзамен</th><th class="text-center">Пересдача</th><th class="text-center">Комиссия</th>
                <th class="text-center">Оценка (балл)</th><th class="text-center">Оценка</th></tr>
              </thead>
              <tbody id="overview"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
CURRENT_USER.role = 'student'; saveRole('student');
CURRENT_USER.name = 'Алексеев Артём Дмитриевич';
CURRENT_USER.avatar = 'АА';
mountHeader();
document.getElementById('app-sidebar').innerHTML = renderStudentSidebar('grades');

const summary = [
  { name:'Программирование',  m1:23, m2:25, m3:20, total:68, exam:24, retake:'—', commission:'—', score:92, grade:'отл' },
  { name:'Высшая математика', m1:18, m2:17, m3:19, total:54, exam:18, retake:'—', commission:'—', score:72, grade:'хор' },
  { name:'Базы данных',       m1:25, m2:26, m3:27, total:78, exam:17, retake:'—', commission:'—', score:95, grade:'отл' },
  { name:'Английский язык',   m1:'зачёт', m2:'зачёт', m3:'зачёт', total:'зачёт', exam:'—', retake:'—', commission:'—', score:'—', grade:'зачёт' },
  { name:'Физика',            m1:12, m2:10, m3:11, total:33, exam:15, retake:22, commission:'—', score:55, grade:'удовл' },
];
const gradeBadge = g => g==='отл'?'badge-role-student':g==='удовл'?'badge-role-teacher':'badge-group';
document.getElementById('overview').innerHTML = summary.map(s => `<tr>
  <td><a href="student-subject.html?subject=1" class="fw-semibold">${s.name}</a></td>
  <td class="text-center">${s.m1}</td><td class="text-center">${s.m2}</td><td class="text-center">${s.m3}</td>
  <td class="text-center">${s.total}</td>
  <td class="text-center">${s.exam}</td><td class="text-center">${s.retake}</td><td class="text-center">${s.commission}</td>
  <td class="text-center"><b>${s.score}</b></td>
  <td class="text-center"><span class="badge ${gradeBadge(s.grade)}">${s.grade}</span></td>
</tr>`).join('');
initPage();
</script>
</body>
</html>
