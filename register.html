<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — ModulUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('modulus-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

<div class="animated-bg"></div>

<nav class="navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Modul<span class="brand-dot">US</span></a>
    <div class="d-flex align-items-center gap-2">
      <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему"></button>
      <a href="login.html" class="btn btn-outline-primary btn-sm d-none d-sm-inline-block">Войти</a>
    </div>
  </div>
</nav>

<div class="container" style="padding:2rem 0 3rem;">
  <div class="glass w-100 mx-auto" style="max-width:560px;padding:2.5rem;" data-reveal="scale">
    <h3 class="fw-bold text-center mb-1">Создать аккаунт</h3>
    <p style="color:var(--text-muted);" class="text-center mb-4">Это бесплатно — займёт меньше минуты</p>

    <label class="form-label fw-semibold">Я регистрируюсь как:</label>
    <div class="row g-2 mb-4">
      <div class="col-6">
        <label class="role-pick d-block text-center">
          <input type="radio" name="role" value="teacher" class="d-none" checked>
          <div class="fs-3">👩‍🏫</div>
          <div class="fw-semibold">Преподаватель</div>
          <small style="color:var(--text-muted);">Создаю журнал</small>
        </label>
      </div>
      <div class="col-6">
        <label class="role-pick d-block text-center">
          <input type="radio" name="role" value="student" class="d-none">
          <div class="fs-3">🎓</div>
          <div class="fw-semibold">Студент</div>
          <small style="color:var(--text-muted);">Смотрю оценки</small>
        </label>
      </div>
    </div>

    <form onsubmit="return doRegister(event)">
      <div id="teacher-fields">
        <div class="row g-2">
          <div class="col-md-6 mb-3">
            <label class="form-label">ФИО</label>
            <input type="text" class="form-control" placeholder="Иванова Мария Петровна" value="Иванова Мария Петровна" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Кафедра</label>
            <input type="text" class="form-control" placeholder="Информационных технологий" value="Информационных технологий">
          </div>
        </div>
      </div>

      <div id="student-fields" style="display:none;">
        <div class="row g-2">
          <div class="col-md-6 mb-3">
            <label class="form-label">ФИО</label>
            <input type="text" class="form-control" placeholder="Алексеев Артём Дмитриевич">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Группа</label>
            <input type="text" class="form-control" placeholder="ПИб-231">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Код приглашения (если есть)</label>
          <input type="text" class="form-control" placeholder="например, abc123xyz">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" placeholder="you@university.ru" required>
        </div>
      </div>
      <div class="row g-2">
        <div class="col-md-6 mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Повтор пароля</label>
          <input type="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="agree" required>
        <label class="form-check-label small" for="agree">
          Согласен с <a href="#" onclick="return false;">условиями</a> и <a href="#" onclick="return false;">политикой конфиденциальности</a>
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2">Зарегистрироваться</button>
    </form>

    <hr class="my-4">
    <div class="text-center small" style="color:var(--text-muted);">
      Уже есть аккаунт? <a href="login.html">Войти</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.querySelectorAll('input[name=role]').forEach(r => {
  r.addEventListener('change', () => {
    const isTeacher = document.querySelector('input[name=role]:checked').value === 'teacher';
    document.getElementById('teacher-fields').style.display = isTeacher ? '' : 'none';
    document.getElementById('student-fields').style.display = isTeacher ? 'none' : '';
  });
});
function doRegister(e) {
  e.preventDefault();
  const role = document.querySelector('input[name=role]:checked').value;
  toast('Аккаунт ' + (role === 'teacher' ? 'преподавателя' : 'студента') + ' создан', 'success');
  setTimeout(() => location.href = role === 'teacher' ? 'teacher-dashboard.html' : 'student-dashboard.html', 800);
  return false;
}
initPage();
</script>
</body>
</html>
